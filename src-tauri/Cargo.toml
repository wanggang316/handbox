[package]
name = "handbox"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "handbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = "1.0"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "test", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
# 0.9 accepts libsqlite3-sys >=0.30.1,<0.38, which is what lets it share the
# single `links = "sqlite3"` slot with hand-agent's rusqlite 0.37. Staying on
# 0.7 (libsqlite3-sys 0.27) makes the dependency graph unresolvable.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
rand = "0.8"
url = "2.5"
regex = "1.0"
tiny_http = "0.12"
base64 = "0.22"
jsonwebtoken = "9.3"
dotenvy = "0.15"
urlencoding = "2.1"
once_cell = "1.19"
# Align with hand-ai/crates/model so both pull the same crate copy
# (avoids double-link). See exec-plans/hand-ai-integration.md.
openai-rust = { git = "https://github.com/wanggang316/openai-rust", tag = "v0.2.1" }
google-genai-rust = { git = "https://github.com/wanggang316/google-genai-rust", tag = "v0.1.0" }
async-stream = "0.3"
rmcp = { version = "0.7", features = [
    "client",
    "transport-child-process",
    "transport-sse-client-reqwest",
    "transport-streamable-http-client-reqwest",
] }
shlex = "1.3"
image = "0.25"
arboard = "3.4"
handbox-mcp = { path = "crates/handbox-mcp" }
# Direct dep on hand-ai's model crate for services/chat_engine.rs (M2-T1).
# Single source of truth for provider catalog + chat after the
# dissolve-handbox-llm migration. HandBox uses the embedded catalog only;
# v0.4.0 additionally streams the Anthropic Messages API incrementally
# instead of buffering the whole reply (hand-ai#135).
hand-ai-model = { git = "https://github.com/wanggang316/hand-ai.git", tag = "v0.4.2", package = "model" }
# Agent runtime crate from hand-ai, same git source + tag as the model crate
# above so Cargo unifies the transitive `model` dependency to a single copy
# (hand-agent depends on model via path; same-source+same-tag => dedup).
hand-agent = { git = "https://github.com/wanggang316/hand-ai.git", tag = "v0.4.2", package = "hand-agent" }
# Coding-agent runtime crate from hand-ai, same git source + tag as the model
# and hand-agent crates above so Cargo unifies the transitive `model`/`hand-agent`
# dependencies to a single copy (same-source+same-tag => dedup). Drives Agent
# mode: sessions, tools, and the extension hook chain (services/agent_permission).
#
# `default-features = false` drops the crate's `sqlite` feature, and with it
# rusqlite's `links = "sqlite3"` claim — cargo allows only one per graph, and
# sqlx already holds it. Sessions stay on `SessionBackend::Jsonl`, which is what
# HandBox uses; selecting the sqlite backend would now fail loudly.
hand-coding-agent = { git = "https://github.com/wanggang316/hand-ai.git", tag = "v0.4.2", package = "hand-coding-agent", default-features = false }
tokio-util = "0.7"
croner = "3.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.23"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "libc"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString", "NSURL", "NSData", "NSArray", "NSDictionary"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "0.6"
rdev = { git = "https://github.com/Narsil/rdev", branch = "main" }
accessibility = { git = "https://github.com/eiz/accessibility" }
accessibility-sys = { git = "https://github.com/eiz/accessibility" }
# Swift 桥接
swift-rs = "1.0"
mouce = "0.3.0"

[dev-dependencies]
tempfile = "3.21.0"


